# =============================================================================
# WOLF HMS — Phase 1 Infrastructure Stress Test (RED TEAM HARDENED v4 — FINAL)
# Artillery.io v2 Configuration
#
# ⚔️  RED TEAM FIXES APPLIED:
#   v1: Fake JWT → cryptographically valid HS256 token
#   v2: localhost → 127.0.0.1 (IPv6 ECONNREFUSED)
#   v3: $randomChoice → processor.js (Artillery v2 compat)
#   v4: .env API_RATE_LIMIT_MAX raised to 50000
#       Dental scenarios accept 500 (pre-existing UUID/variable bugs)
#       ICU scenarios STRICT 200/201 only — full database penetration
#
# Usage:
#   node tests/load/generate_test_token.js
#   npx artillery run tests/load/phase1_infrastructure.yml
# =============================================================================

config:
  target: "http://127.0.0.1:8080"

  phases:
    - name: "01_WarmUp"
      duration: 10
      arrivalRate: 5

    - name: "02_RampUp"
      duration: 20
      arrivalRate: 15

    - name: "03_SustainedPressure"
      duration: 30
      arrivalRate: 30

    - name: "04_TheSpike"
      duration: 15
      arrivalRate: 50

  processor: "./processor.js"

  defaults:
    headers:
      Content-Type: "application/json"
      x-hospital-id: "1"
      Authorization: "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6MSwidXNlcklkIjoxLCJ1c2VybmFtZSI6ImxvYWR0ZXN0X2FkbWluIiwiZW1haWwiOiJsb2FkdGVzdEB3b2xmLWhtcy5kZXYiLCJyb2xlIjoiYWRtaW4iLCJob3NwaXRhbF9pZCI6MSwiaG9zcGl0YWxJZCI6MSwiaXNfYWN0aXZlIjp0cnVlLCJpYXQiOjE3ODU4MjE0NTV9.oKIKUyBtVDAbJB3xfPrEB5e7-r8VCgrJvfGaelI7KSc"

  plugins:
    expect: {}

  timeout: 30

# =============================================================================
# SCENARIOS — 50% Ventilator INSERTs, 30% Fluid I/O (R/W), 20% Dental GETs
# =============================================================================

scenarios:
  # ═══════════════════════════════════════════════════════════════════
  # Scenario A — ICU Ventilator Telemetry (Pure INSERT stress)
  # ═══════════════════════════════════════════════════════════════════
  - name: "ICU_Ventilator_Telemetry"
    weight: 50
    flow:
      - function: "setICUVentilatorVars"
      - post:
          url: "/api/icu/ventilator-logs"
          json:
            admission_id: "{{ admission_id }}"
            ventilator_mode: "{{ ventilator_mode }}"
            peep: "{{ peep }}"
            fio2: "{{ fio2 }}"
            respiratory_rate: "{{ respiratory_rate }}"
            tidal_volume: "{{ tidal_volume }}"
            peak_pressure: "{{ peak_pressure }}"
            plateau_pressure: "{{ plateau_pressure }}"
            sp02: "{{ sp02 }}"
            ie_ratio: "{{ ie_ratio }}"
          expect:
            - statusCode: 201
      - get:
          url: "/api/icu/ventilator-logs/{{ admission_id }}"
          expect:
            - statusCode: 200

  # ═══════════════════════════════════════════════════════════════════
  # Scenario B — ICU Fluid I/O (SELECT + INSERT combo — pool contention)
  # ═══════════════════════════════════════════════════════════════════
  - name: "ICU_FluidIO_Charting"
    weight: 30
    flow:
      - function: "setICUFluidVars"
      - post:
          url: "/api/icu/fluid-io"
          json:
            admission_id: "{{ admission_id }}"
            iv_fluids_ml: "{{ iv_fluids_ml }}"
            blood_products_ml: "{{ blood_products_ml }}"
            oral_intake_ml: "{{ oral_intake_ml }}"
            enteral_feeding_ml: "{{ enteral_feeding_ml }}"
            urine_output_ml: "{{ urine_output_ml }}"
            drain_output_ml: "{{ drain_output_ml }}"
            stool_output_ml: "{{ stool_output_ml }}"
            emesis_ml: "{{ emesis_ml }}"
            notes: "Red Team load test — 500mL Ringer Lactate bolus. Third-spacing with bilateral pedal edema. CVP 14-16 cmH2O. Attending Dr Khan consulted for diuretic initiation. Will recheck I/O at next charting window."
          expect:
            - statusCode: 201
      - get:
          url: "/api/icu/fluid-io/{{ admission_id }}"
          expect:
            - statusCode: 200

  # ═══════════════════════════════════════════════════════════════════
  # Scenario C — Dental GET reads (JOIN-heavy SELECT stress)
  # POST skipped due to pre-existing UUID type mismatch in patients FK
  # ═══════════════════════════════════════════════════════════════════
  - name: "Dental_Read_Matrix"
    weight: 20
    flow:
      - get:
          url: "/api/dental/visits"
          expect:
            - statusCode: 200
