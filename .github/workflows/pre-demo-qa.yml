name: Pre-Demo QA

# On-demand (and nightly) verification funnel for WOLF HMS demo readiness.
# Local evidence for the same funnel lives in plans/ (500-hunter reports, tracked).

on:
  workflow_dispatch:
    inputs:
      seed:
        description: 'Re-seed the golden hospital before the sweep'
        type: boolean
        default: true
  # schedule:
  #   - cron: '0 2 * * *'   # nightly 02:00 UTC (disabled to avoid unsolicited email notifications)

jobs:
  pre-demo-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 10

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      NODE_ENV: development
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: hospital_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      CI: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install backend dependencies
        working-directory: server
        run: npm ci || npm install

      - name: Apply schema migrations + golden seed
        working-directory: server
        run: |
          node scripts/seed-demo-hospital.js
        env:
          # the seed injects its own bcrypt hashes; no extra secrets needed
          DEMO_STAFF_PASSWORD: password123

      - name: Start API (background)
        working-directory: server
        env:
          PORT: 8080
          JWT_SECRET: ci-secret-token-key-for-wolf-hms-testing-purpose-32b
          ADMIN_MIGRATE_SECRET: ci-secret
          SETUP_KEY: WolfSetup2024!
          MIGRATION_CLI_TOKEN: ci-migration-cli-token
        run: |
          mkdir -p ../logs
          nohup node server-cloud.js > ../logs/ci-api.log 2>&1 &
          echo "Server process launched in background (PID: $!). Waiting for /api/health..."
          
          READY=0
          for i in $(seq 1 45); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/api/health || true)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "✅ API is up and healthy! (HTTP 200 after ${i}s)"
              READY=1
              break
            fi
            sleep 1
          done
          
          if [ $READY -ne 1 ]; then
            echo "❌ API failed to respond with HTTP 200 within 45 seconds."
            echo "=== PROCESS LIST ==="
            ps aux | grep node || true
            echo "=== CI API LOG (ci-api.log) ==="
            cat ../logs/ci-api.log || true
            exit 1
          fi

      - name: Backend contract + unit tests
        working-directory: server
        env:
          JWT_SECRET: ci-secret-token-key-for-wolf-hms-testing-purpose-32b
        run: npx jest --forceExit
        continue-on-error: true

      - name: 500-Hunter (demo profile)
        run: node scripts/qa/500-hunter.js --profile demo
        continue-on-error: true

      - name: Install client + Playwright browser
        working-directory: client
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium

      - name: Playwright E2E — golden clinical journey
        working-directory: client
        env:
          E2E_API_ORIGIN: http://127.0.0.1:8080
          E2E_CHANNEL: chromium
        run: npx playwright test
        continue-on-error: true

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-demo-qa-evidence
          path: |
            scripts/qa/500-hunter-report.json
            scripts/qa/500-hunter-report.md
            client/e2e/results/
            client/playwright-report/
            plans/seeded_ids.json
            logs/ci-api.log
          if-no-files-found: warn
